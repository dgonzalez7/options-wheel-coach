<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options Wheel Coach</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --accent: #1e40af;
      --critical: #dc2626;
      --action: #ea580c;
      --caution: #ca8a04;
      --info: #475569;
      --ok: #16a34a;
      --bull: #16a34a;
      --neutral: #475569;
      --bear: #dc2626;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---------- Layout ---------- */

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 24px 48px;
    }

    .app-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 4px 0 16px;
    }
    .app-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .app-title .subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ---------- Account header strip ---------- */

    .account-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .account-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .account-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px 20px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    .regime-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .regime-bull   { background: #dcfce7; color: var(--bull); }
    .regime-neutral{ background: #e2e8f0; color: var(--neutral); }
    .regime-bear   { background: #fee2e2; color: var(--bear); }

    /* ---------- Tab navigation ---------- */

    .tab-nav {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tab-button {
      background: transparent;
      border: 0;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: inherit;
    }
    .tab-button:hover { color: var(--text); }
    .tab-button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ---------- Cards / sections ---------- */

    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .empty-state .hint {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 6px;
    }

    .coming-soon {
      padding: 64px 16px;
      text-align: center;
      color: var(--text-faint);
      font-size: 14px;
    }

    /* ---------- Positions table ---------- */

    .positions-wrap {
      overflow-x: auto;
    }
    table.positions {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }
    table.positions th {
      text-align: left;
      font-weight: 600;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.positions td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.positions tbody tr:hover { background: #f9fafb; }
    table.positions .num { text-align: right; font-variant-numeric: tabular-nums; }

    /* Color-coded value chips */
    .chip-good   { color: var(--ok); }
    .chip-warn   { color: var(--caution); }
    .chip-bad    { color: var(--critical); }
    .chip-bright { color: var(--ok); font-weight: 600; }

    .leg-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      background: #e2e8f0;
      color: var(--text);
    }
    .leg-badge.cc { background: #fef3c7; color: #92400e; }

    .row-alert {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .row-alert.severity-critical { background: #fee2e2; color: var(--critical); }
    .row-alert.severity-action   { background: #fed7aa; color: var(--action); }
    .row-alert.severity-caution  { background: #fef3c7; color: var(--caution); }
    .row-alert.severity-info     { background: #e2e8f0; color: var(--info); }
    .row-alert.severity-ok       { background: #dcfce7; color: var(--ok); }
    .row-alert .rule-id          { font-weight: 400; font-size: 9.5px; opacity: 0.7; margin-left: 4px; }

    /* ---------- Alerts ---------- */

    .alert-row {
      padding: 10px 12px;
      border-left: 3px solid var(--border-strong);
      background: #f9fafb;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .alert-row.severity-critical { border-left-color: var(--critical); }
    .alert-row.severity-action   { border-left-color: var(--action); }
    .alert-row.severity-caution  { border-left-color: var(--caution); }
    .alert-row.severity-info     { border-left-color: var(--info); }
    .alert-row.severity-ok       { border-left-color: var(--ok); }

    .alert-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .severity-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .severity-tag.severity-critical { background: #fee2e2; color: var(--critical); }
    .severity-tag.severity-action   { background: #fed7aa; color: var(--action); }
    .severity-tag.severity-caution  { background: #fef3c7; color: var(--caution); }
    .severity-tag.severity-info     { background: #e2e8f0; color: var(--info); }
    .severity-tag.severity-ok       { background: #dcfce7; color: var(--ok); }

    .alert-label {
      font-weight: 600;
      font-size: 13px;
    }
    .alert-advice {
      font-size: 13px;
      color: var(--text);
      margin: 2px 0;
    }
    .alert-advice strong { font-weight: 600; }
    .alert-consider {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }
    .alert-ping {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 4px;
    }

    /* ---------- Footer ---------- */

    .footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-faint);
      display: flex;
      justify-content: space-between;
    }

    /* ---------- Errors ---------- */

    .error-banner {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: var(--critical);
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .error-banner .error-title { font-weight: 600; margin-bottom: 4px; }
    .error-banner code {
      background: rgba(220, 38, 38, 0.08);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 12px;
    }

    /* ---------- Risk tab ---------- */

    .risk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .risk-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
      border-left: 3px solid var(--border-strong);
    }
    .risk-card.status-good { border-left-color: var(--ok); }
    .risk-card.status-warn { border-left-color: var(--caution); }
    .risk-card.status-bad  { border-left-color: var(--critical); }
    .risk-card .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .risk-card .value {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .risk-card .value.status-good { color: var(--ok); }
    .risk-card .value.status-warn { color: var(--caution); }
    .risk-card .value.status-bad  { color: var(--critical); }
    .risk-card .sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .risk-bar-row {
      display: grid;
      grid-template-columns: 180px 1fr 80px;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .risk-bar-label {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .risk-bar-label .sub {
      color: var(--text-faint);
      font-size: 11px;
      margin-left: 6px;
    }
    .risk-bar-track {
      position: relative;
      height: 14px;
      background: #f1f5f9;
      border-radius: 7px;
      overflow: visible;
    }
    .risk-bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 7px;
    }
    .risk-bar-fill.good { background: var(--ok); }
    .risk-bar-fill.warn { background: var(--caution); }
    .risk-bar-fill.bad  { background: var(--critical); }
    .risk-bar-threshold {
      position: absolute;
      top: -3px; bottom: -3px;
      width: 2px;
      background: rgba(15, 23, 42, 0.4);
    }
    .risk-bar-threshold-label {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--text-faint);
      white-space: nowrap;
    }
    .risk-bar-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--text-muted);
    }
    .risk-bar-value.status-bad  { color: var(--critical); font-weight: 600; }
    .risk-bar-value.status-warn { color: var(--caution); font-weight: 600; }
    .risk-bar-value.status-good { color: var(--text-muted); }

    .risk-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .risk-list-item:last-child { border-bottom: none; }
    .risk-list-item .dte-pill {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e2e8f0;
      color: var(--text);
      min-width: 60px;
      text-align: center;
    }
    .risk-list-item .dte-pill.urgent { background: #fed7aa; color: var(--action); }
    .risk-list-item .dte-pill.critical { background: #fee2e2; color: var(--critical); }
    .risk-list-item .label { flex: 1; }
    .risk-list-item .meta { font-size: 11px; color: var(--text-muted); }

    .risk-empty {
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      font-style: italic;
    }

    /* ---------- Responsive ---------- */

    @media (max-width: 1100px) {
      .account-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .account-header { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="app-title">
      <h1>Options Wheel Coach</h1>
      <span class="subtitle">Phase 2 · daily updater live</span>
    </div>

    <div id="error-container"></div>

    <!-- Account header strip -->
    <header class="account-header" id="account-header">
      <div class="account-name" id="account-name">—</div>
      <div class="account-stats" id="account-stats"></div>
      <div id="regime-container"></div>
    </header>

    <!-- Tab navigation -->
    <nav class="tab-nav" role="tablist">
      <button class="tab-button active" data-tab="today" role="tab">Today</button>
      <button class="tab-button" data-tab="performance" role="tab">Performance</button>
      <button class="tab-button" data-tab="risk" role="tab">Risk</button>
      <button class="tab-button" data-tab="history" role="tab">History</button>
    </nav>

    <!-- Tab content -->
    <main>

      <!-- Today -->
      <section id="tab-today" class="tab-pane active" role="tabpanel">
        <div class="section">
          <h2>Alerts</h2>
          <div id="alerts-panel"></div>
        </div>

        <div class="section">
          <h2>Open Positions</h2>
          <div id="positions-container"></div>
        </div>
      </section>

      <!-- Performance -->
      <section id="tab-performance" class="tab-pane" role="tabpanel">
        <div class="section">
          <div class="coming-soon">Coming in Phase 3.</div>
        </div>
      </section>

      <!-- Risk -->
      <section id="tab-risk" class="tab-pane" role="tabpanel">
        <div class="risk-grid" id="risk-health-cards"></div>

        <div class="section">
          <h2>Position Sizing</h2>
          <div id="risk-positions"></div>
        </div>

        <div class="section">
          <h2>Sector Concentration</h2>
          <div id="risk-sectors"></div>
        </div>

        <div class="section">
          <h2>Calendar Landmines</h2>
          <div id="risk-calendar"></div>
        </div>
      </section>

      <!-- History -->
      <section id="tab-history" class="tab-pane" role="tabpanel">
        <div class="section">
          <div class="coming-soon">Coming in Phase 3.</div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <span>Snapshot: <span id="snapshot-ts">—</span></span>
      <span>dgonzalez7 / options-wheel-coach</span>
    </footer>

  </div>

  <!-- Generated by scripts/build_dashboard_data.py. Gitignored. -->
  <script src="data.js"></script>

  <script>
    // ---------- Formatters ----------

    const fmtMoney0 = (n) =>
      typeof n === "number"
        ? "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 })
        : "—";

    const fmtMoney2 = (n) =>
      typeof n === "number"
        ? "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : "—";

    const fmtPct1 = (n) =>
      typeof n === "number" ? n.toFixed(1) + "%" : "—";

    const fmtDate = (iso) => {
      if (!iso) return "—";
      try {
        const d = new Date(iso + "T00:00:00");
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      } catch {
        return iso;
      }
    };

    // ---------- Tab switching ----------

    document.querySelectorAll(".tab-button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll(".tab-button").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + tab).classList.add("active");
      });
    });

    // ---------- Computed metrics ----------

    function computePositionMetrics(position, portfolio) {
      const m = { ...position };
      m.collateral =
        position.leg === "CSP"
          ? position.strike * 100 * position.contracts
          : 0;
      m.share_value =
        position.leg === "CC" && position.current_stock_price
          ? position.current_stock_price * 100 * position.contracts
          : 0;

      // Cushion %
      if (position.current_stock_price !== null && position.current_stock_price !== undefined) {
        if (position.leg === "CSP") {
          m.cushion_pct = (position.current_stock_price - position.strike) / position.strike * 100;
        } else {
          m.cushion_pct = (position.strike - position.current_stock_price) / position.current_stock_price * 100;
        }
      }

      // Stock move since open
      if (position.current_stock_price !== null && position.entry_stock_price) {
        m.stock_move_pct = (position.current_stock_price - position.entry_stock_price) / position.entry_stock_price * 100;
      }

      // Premium captured + unrealized P&L
      if (position.current_option_price !== null && position.current_option_price !== undefined && position.entry_premium_per_share) {
        m.pct_captured = (position.entry_premium_per_share - position.current_option_price) / position.entry_premium_per_share * 100;
        m.unrealized_pnl = (position.entry_premium_per_share - position.current_option_price) * 100 * position.contracts;
      }

      // Position % of portfolio
      const total = portfolio ? portfolio.total_account_value : 0;
      if (total > 0) {
        const exposure = position.leg === "CSP" ? m.collateral : m.share_value;
        m.position_pct = exposure / total * 100;
      }

      return m;
    }

    // Calendar-day DTE fallback (used when an alert isn't available with trading-day DTE)
    function dteCalendar(expirationISO) {
      if (!expirationISO) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const exp = new Date(expirationISO + "T00:00:00");
      const diffMs = exp - today;
      return Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
    }

    // Color class for cushion %
    function cushionClass(c) {
      if (c === null || c === undefined) return "";
      if (c < 0) return "chip-bad";
      if (c < 3) return "chip-warn";
      return "chip-good";
    }

    // Color class for % captured
    function capturedClass(c) {
      if (c === null || c === undefined) return "";
      if (c >= 80) return "chip-bright";
      if (c >= 50) return "chip-good";
      if (c < 0) return "chip-bad";
      return "";
    }

    // Color class for position % of portfolio
    function posPctClass(p) {
      if (p === null || p === undefined) return "";
      if (p >= 10) return "chip-bad";
      if (p >= 8) return "chip-warn";
      return "";
    }

    // Color class for P&L
    function pnlClass(v) {
      if (v === null || v === undefined) return "";
      return v >= 0 ? "chip-good" : "chip-bad";
    }

    function computePortfolioMetrics(portfolio, positions) {
      let csp_collateral_total = 0;
      let share_value_total = 0;
      for (const p of positions) {
        const m = computePositionMetrics(p, portfolio);
        csp_collateral_total += m.collateral;
        share_value_total += m.share_value;
      }
      const deployed = csp_collateral_total + share_value_total;
      const total = portfolio.total_account_value || 0;
      const cash = portfolio.cash_available || 0;
      const non_cash = Math.max(0, total - cash);
      const buffer_pct = portfolio.wheel_buffer_pct || 0;
      const wheel_buffer = non_cash * buffer_pct / 100;
      const effective_cash = cash + wheel_buffer;
      return {
        csp_collateral_total,
        share_value_total,
        deployed,
        deployment_pct: total > 0 ? (deployed / total) * 100 : 0,
        cash_pct: total > 0 ? (cash / total) * 100 : 0,
        non_cash,
        wheel_buffer,
        effective_cash,
        buffer_pct,
        active_count: positions.length,
      };
    }

    // ---------- Rendering ----------

    function renderHeader(portfolio, positions) {
      const m = computePortfolioMetrics(portfolio, positions);

      document.getElementById("account-name").textContent =
        portfolio.account_name || "Account";

      const stats = [
        {
          label: "Total Value",
          value: fmtMoney0(portfolio.total_account_value),
          sub: "as of " + fmtDate(portfolio.as_of),
        },
        {
          label: "Cash Available",
          value: fmtMoney0(portfolio.cash_available),
          sub: fmtPct1(m.cash_pct) + " of total",
        },
      ];
      if (m.buffer_pct > 0) {
        stats.push({
          label: "Effective Cash",
          value: fmtMoney0(m.effective_cash),
          sub: "Includes Wheel Buffer of " + fmtMoney0(m.wheel_buffer) +
            " (" + m.buffer_pct.toFixed(0) + "% of non-cash)",
        });
      }
      stats.push(
        {
          label: "CSP Collateral",
          value: fmtMoney0(m.csp_collateral_total),
          sub:
            positions.filter((p) => p.leg === "CSP").length +
            " open put" +
            (positions.filter((p) => p.leg === "CSP").length === 1 ? "" : "s"),
        },
        {
          label: "Share Value",
          value: fmtMoney0(m.share_value_total),
          sub:
            positions.filter((p) => p.leg === "CC").length +
            " held position" +
            (positions.filter((p) => p.leg === "CC").length === 1 ? "" : "s"),
        },
        {
          label: "Deployed",
          value: fmtPct1(m.deployment_pct),
          sub: fmtMoney0(m.deployed) + " of " + fmtMoney0(portfolio.total_account_value),
        },
        {
          label: "Positions",
          value: String(m.active_count),
          sub: "open",
        },
      );

      const statsEl = document.getElementById("account-stats");
      statsEl.innerHTML = stats
        .map(
          (s) => `
        <div class="stat">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
          <div class="stat-sub">${s.sub}</div>
        </div>`
        )
        .join("");

      const regime = (portfolio.market_regime || "neutral").toLowerCase();
      document.getElementById("regime-container").innerHTML =
        `<span class="regime-badge regime-${regime}">${regime}</span>`;
    }

    function renderAlerts(alerts) {
      const el = document.getElementById("alerts-panel");
      if (!alerts || alerts.length === 0) {
        el.innerHTML = `
          <div class="empty-state">
            No active alerts.
            <div class="hint">The daily script (Phase 2) will populate this panel after each evaluation run.</div>
          </div>`;
        return;
      }
      el.innerHTML = alerts
        .map((a) => {
          const sev = (a.severity || "info").toLowerCase();
          return `
          <div class="alert-row severity-${sev}">
            <div class="alert-head">
              <span class="severity-tag severity-${sev}">${a.severity}</span>
              <span class="alert-label">${a.ticker || ""} ${a.rule_id || ""}</span>
            </div>
            <div class="alert-advice"><strong>Conservative Advice:</strong> ${a.conservative_advice || ""}</div>
            <div class="alert-consider">Consider: ${a.consider || ""}</div>
            <div class="alert-ping">Ping Claude for the walkthrough.</div>
          </div>`;
        })
        .join("");
    }

    function renderPositions(positions, portfolio, alerts) {
      const container = document.getElementById("positions-container");
      if (!positions || positions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            No open positions.
            <div class="hint">Tell Claude in chat when you place a trade and it will be added here.</div>
          </div>`;
        return;
      }

      // Map position_id -> alert for badge + accurate DTE
      const alertByPid = {};
      for (const a of (alerts || [])) {
        if (a.position_id) alertByPid[a.position_id] = a;
      }

      const rows = positions
        .map((p) => {
          const m = computePositionMetrics(p, portfolio);
          const a = alertByPid[p.id];
          const sectorTag = p.sector_override || p.sector || "—";
          const dte = a && a.computed_state && a.computed_state.dte !== undefined
            ? a.computed_state.dte
            : dteCalendar(p.expiration_date);
          const cushion = m.cushion_pct;
          const captured = m.pct_captured;
          const stockMove = m.stock_move_pct;
          const posPct = m.position_pct;
          const pnl = m.unrealized_pnl;

          const legBadge = `<span class="leg-badge ${p.leg.toLowerCase()}">${p.leg}</span>`;

          let alertCell = "—";
          if (a) {
            const sev = a.severity.toLowerCase();
            const ruleShort = a.rule_id ? a.rule_id.replace(/^(csp|cc|portfolio)_/, "") : "";
            alertCell = `<span class="row-alert severity-${sev}">${a.severity}<span class="rule-id">${ruleShort}</span></span>`;
          }

          return `
          <tr>
            <td><strong>${p.ticker}</strong> <span style="color: var(--text-faint); font-size: 10.5px;">${sectorTag}</span></td>
            <td>${legBadge}</td>
            <td class="num">${fmtMoney2(p.strike)}</td>
            <td class="num">${p.contracts}</td>
            <td>${fmtDate(p.expiration_date)}</td>
            <td class="num">${dte !== null && dte !== undefined ? dte : "—"}</td>
            <td class="num">${fmtMoney2(p.entry_premium_per_share)}</td>
            <td class="num">${p.current_option_price !== null && p.current_option_price !== undefined ? fmtMoney2(p.current_option_price) : "—"}</td>
            <td class="num ${capturedClass(captured)}">${captured !== undefined && captured !== null ? captured.toFixed(0) + "%" : "—"}</td>
            <td class="num">${p.current_stock_price !== null && p.current_stock_price !== undefined ? fmtMoney2(p.current_stock_price) : "—"}${stockMove !== undefined && stockMove !== null ? ` <span style="color: var(--text-faint); font-size: 11px;">(${stockMove >= 0 ? "+" : ""}${stockMove.toFixed(1)}%)</span>` : ""}</td>
            <td class="num ${cushionClass(cushion)}">${cushion !== undefined && cushion !== null ? (cushion >= 0 ? "+" : "") + cushion.toFixed(1) + "%" : "—"}</td>
            <td class="num ${posPctClass(posPct)}">${posPct !== undefined && posPct !== null ? posPct.toFixed(1) + "%" : "—"}</td>
            <td class="num">${fmtMoney0(m.collateral || m.share_value)}</td>
            <td class="num ${pnlClass(pnl)}">${pnl !== undefined && pnl !== null ? (pnl >= 0 ? "+" : "") + fmtMoney0(pnl) : "—"}</td>
            <td>${alertCell}</td>
          </tr>`;
        })
        .join("");

      container.innerHTML = `
        <div class="positions-wrap">
          <table class="positions">
            <thead>
              <tr>
                <th>Ticker</th>
                <th>Leg</th>
                <th class="num">Strike</th>
                <th class="num">Cont</th>
                <th>Exp</th>
                <th class="num">DTE</th>
                <th class="num">Entry</th>
                <th class="num">Now</th>
                <th class="num">%Capt</th>
                <th class="num">Stock</th>
                <th class="num">Cushion</th>
                <th class="num">Pos %</th>
                <th class="num">Collateral</th>
                <th class="num">P&amp;L</th>
                <th>Alert</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    // Regime-aware caps; mirrors DEPLOYMENT_CAPS in alerts_engine.py
    const DEPLOYMENT_CAPS = { bull: 60, neutral: 55, bear: 50 };
    const CASH_RESERVE_TARGETS = { bull: 25, neutral: 30, bear: 40 };

    function renderRiskTab(portfolio, positions, alerts) {
      const m = computePortfolioMetrics(portfolio, positions);
      const regime = (portfolio.market_regime || "bull").toLowerCase();
      const depCap = DEPLOYMENT_CAPS[regime] || 60;
      const cashTarget = CASH_RESERVE_TARGETS[regime] || 25;

      // ---- Health cards ----
      const cardsEl = document.getElementById("risk-health-cards");
      // Cash reserve status
      const cashStatus = m.cash_pct >= cashTarget ? "good"
        : m.cash_pct >= 20 ? "warn" : "bad";
      // Deployment status
      const depStatus = m.deployment_pct <= depCap ? "good"
        : m.deployment_pct <= depCap + 5 ? "warn" : "bad";
      // Stress test
      const stressGap = m.csp_collateral_total - m.effective_cash;
      const stressStatus = stressGap <= 0 ? "good" : "bad";
      // ITM count
      const itmPositions = positions.filter((p) => {
        if (p.current_stock_price === null || p.current_stock_price === undefined) return false;
        return p.leg === "CSP"
          ? p.current_stock_price < p.strike
          : p.current_stock_price > p.strike;
      });
      const itmTotal = itmPositions.reduce((sum, p) => {
        const m2 = computePositionMetrics(p, portfolio);
        return sum + (m2.collateral || m2.share_value || 0);
      }, 0);

      const cards = [
        {
          label: "Cash Reserve",
          value: fmtPct1(m.cash_pct),
          sub: fmtMoney0(portfolio.cash_available) +
            " · target " + cashTarget + "% (" + regime + ")",
          status: cashStatus,
        },
      ];
      // Conditional Effective Reserve card when wheel_buffer is active.
      if (m.buffer_pct > 0) {
        const total = portfolio.total_account_value || 0;
        const effPct = total > 0 ? (m.effective_cash / total) * 100 : 0;
        const effStatus = effPct >= cashTarget ? "good"
          : effPct >= 20 ? "warn" : "bad";
        cards.push({
          label: "Effective Reserve",
          value: fmtPct1(effPct),
          sub: fmtMoney0(m.effective_cash) +
            " (cash + " + m.buffer_pct.toFixed(0) + "% buffer = " +
            fmtMoney0(m.wheel_buffer) + ") · target " + cashTarget + "%",
          status: effStatus,
        });
      }
      cards.push(
        {
          label: "Deployment",
          value: fmtPct1(m.deployment_pct),
          sub: fmtMoney0(m.deployed) + " of " + fmtMoney0(portfolio.total_account_value) +
            " · cap " + depCap + "% (" + regime + ")",
          status: depStatus,
        },
        {
          label: "Stress Test",
          value: stressGap <= 0 ? "PASS" : "FAIL",
          sub: stressGap <= 0
            ? "effective cash exceeds CSP collateral by " + fmtMoney0(-stressGap)
            : "shortfall " + fmtMoney0(stressGap) + " vs effective cash " + fmtMoney0(m.effective_cash),
          status: stressStatus,
        },
        {
          label: "ITM Exposure",
          value: String(itmPositions.length),
          sub: itmPositions.length === 0
            ? "no positions in-the-money"
            : itmTotal === 0
              ? itmPositions.length + " position(s) ITM"
              : fmtMoney0(itmTotal) + " across " + itmPositions.length + " position(s)",
          status: itmPositions.length === 0 ? "good" : "warn",
        },
      );

      cardsEl.innerHTML = cards
        .map(
          (c) => `
        <div class="risk-card status-${c.status}">
          <div class="label">${c.label}</div>
          <div class="value status-${c.status}">${c.value}</div>
          <div class="sub">${c.sub}</div>
        </div>`
        )
        .join("");

      // ---- Position sizing bars ----
      const posEl = document.getElementById("risk-positions");
      if (positions.length === 0) {
        posEl.innerHTML = `<div class="risk-empty">No open positions.</div>`;
      } else {
        const SIZE_CEILING = 10;  // hard rule
        const SIZE_WARN = 8;      // warning threshold
        // Width of the bar represents 0..max where max = max(15, biggest position + 2)
        const sized = positions
          .map((p) => {
            const pm = computePositionMetrics(p, portfolio);
            return { p, pos_pct: pm.position_pct || 0, exposure: pm.collateral || pm.share_value || 0 };
          })
          .sort((a, b) => b.pos_pct - a.pos_pct);
        const maxPct = Math.max(15, ...sized.map((s) => s.pos_pct + 2));
        posEl.innerHTML = sized
          .map(({ p, pos_pct, exposure }) => {
            const status = pos_pct >= SIZE_CEILING ? "bad"
              : pos_pct >= SIZE_WARN ? "warn" : "good";
            const fillW = Math.min(100, (pos_pct / maxPct) * 100);
            const warnX = (SIZE_WARN / maxPct) * 100;
            const ceilingX = (SIZE_CEILING / maxPct) * 100;
            return `
            <div class="risk-bar-row">
              <div class="risk-bar-label">
                <strong>${p.ticker}</strong>
                <span class="sub">$${p.strike} ${p.leg}</span>
              </div>
              <div class="risk-bar-track">
                <div class="risk-bar-fill ${status}" style="width:${fillW}%"></div>
                <div class="risk-bar-threshold" style="left:${warnX}%"></div>
                <div class="risk-bar-threshold" style="left:${ceilingX}%"></div>
              </div>
              <div class="risk-bar-value status-${status}">
                ${pos_pct.toFixed(1)}%
              </div>
            </div>`;
          })
          .join("") +
          `<div class="sub" style="font-size:11px;color:var(--text-faint);margin-top:8px;">
            Thresholds: 8% warning · 10% ceiling
          </div>`;
      }

      // ---- Sector concentration ----
      const sectorEl = document.getElementById("risk-sectors");
      const bySector = {};
      for (const p of positions) {
        const sec = p.sector_override || p.sector || "Unknown";
        if (!bySector[sec]) bySector[sec] = { value: 0, count: 0 };
        const pm = computePositionMetrics(p, portfolio);
        bySector[sec].value += pm.collateral || pm.share_value || 0;
        bySector[sec].count += 1;
      }
      const SECTOR_CAP = (portfolio.sector_limits && portfolio.sector_limits.max_per_sector_pct) || 25;
      const SECTOR_POS_MAX = (portfolio.sector_limits && portfolio.sector_limits.max_positions_per_sector) || 3;
      const total = portfolio.total_account_value || 1;
      const sectors = Object.entries(bySector)
        .map(([sec, d]) => ({ sec, pct: (d.value / total) * 100, value: d.value, count: d.count }))
        .sort((a, b) => b.pct - a.pct);

      if (sectors.length === 0) {
        sectorEl.innerHTML = `<div class="risk-empty">No open positions yet.</div>`;
      } else {
        const maxPct = Math.max(SECTOR_CAP + 5, ...sectors.map((s) => s.pct + 2));
        sectorEl.innerHTML = sectors
          .map(({ sec, pct, value, count }) => {
            const status = pct > SECTOR_CAP ? "bad"
              : pct > SECTOR_CAP - 5 ? "warn" : "good";
            const countOver = count > SECTOR_POS_MAX;
            const fillW = Math.min(100, (pct / maxPct) * 100);
            const capX = (SECTOR_CAP / maxPct) * 100;
            return `
            <div class="risk-bar-row">
              <div class="risk-bar-label">
                <strong>${sec}</strong>
                <span class="sub">${count}${countOver ? `/${SECTOR_POS_MAX}⚠` : ""} pos · ${fmtMoney0(value)}</span>
              </div>
              <div class="risk-bar-track">
                <div class="risk-bar-fill ${status}" style="width:${fillW}%"></div>
                <div class="risk-bar-threshold" style="left:${capX}%"></div>
              </div>
              <div class="risk-bar-value status-${status}">
                ${pct.toFixed(1)}%
              </div>
            </div>`;
          })
          .join("") +
          `<div class="sub" style="font-size:11px;color:var(--text-faint);margin-top:8px;">
            Threshold: ${SECTOR_CAP}% per sector · max ${SECTOR_POS_MAX} positions per sector
          </div>`;
      }

      // ---- Calendar landmines ----
      const calEl = document.getElementById("risk-calendar");
      const alertByPid = {};
      for (const a of (alerts || [])) if (a.position_id) alertByPid[a.position_id] = a;
      const getDte = (p) => {
        const a = alertByPid[p.id];
        return (a && a.computed_state && a.computed_state.dte !== undefined)
          ? a.computed_state.dte
          : dteCalendar(p.expiration_date);
      };
      // Earnings inside DTE
      const earningsInDte = positions.filter((p) => {
        if (!p.earnings_date) return false;
        const e = new Date(p.earnings_date + "T00:00:00");
        const x = new Date(p.expiration_date + "T00:00:00");
        return e < x;
      });
      // Positions within 14 DTE (sorted by DTE asc)
      const within14 = positions
        .filter((p) => {
          const d = getDte(p);
          return d !== null && d !== undefined && d <= 14;
        })
        .sort((a, b) => (getDte(a) || 0) - (getDte(b) || 0));

      const parts = [];
      if (earningsInDte.length > 0) {
        parts.push(`<div style="font-weight:600;font-size:12px;color:var(--critical);margin-bottom:6px;">Earnings inside DTE (${earningsInDte.length})</div>`);
        parts.push(earningsInDte.map((p) => `
          <div class="risk-list-item">
            <span class="dte-pill critical">earn ${p.earnings_date}</span>
            <span class="label"><strong>${p.ticker}</strong> $${p.strike} ${p.leg} · exp ${fmtDate(p.expiration_date)}</span>
          </div>
        `).join(""));
      }
      if (within14.length > 0) {
        parts.push(`<div style="font-weight:600;font-size:12px;color:var(--text);margin-top:${earningsInDte.length ? 12 : 0}px;margin-bottom:6px;">Within 14 DTE (${within14.length})</div>`);
        parts.push(within14.map((p) => {
          const d = getDte(p);
          const cls = d <= 7 ? "urgent" : "";
          return `
            <div class="risk-list-item">
              <span class="dte-pill ${cls}">${d} DTE</span>
              <span class="label"><strong>${p.ticker}</strong> $${p.strike} ${p.leg}</span>
              <span class="meta">exp ${fmtDate(p.expiration_date)}</span>
            </div>`;
        }).join(""));
      }
      if (parts.length === 0) {
        calEl.innerHTML = `<div class="risk-empty">No upcoming expirations within 14 DTE and no earnings inside any contract.</div>`;
      } else {
        calEl.innerHTML = parts.join("");
      }
    }

    function renderFooter(portfolio, builtAt) {
      const snap = fmtDate(portfolio.as_of) + " (manual)";
      const built = builtAt
        ? " · built " + new Date(builtAt).toLocaleString()
        : "";
      document.getElementById("snapshot-ts").textContent = snap + built;
    }

    // ---------- Error display ----------

    function showError(err) {
      const ec = document.getElementById("error-container");
      ec.innerHTML = `
        <div class="error-banner">
          <div class="error-title">Could not load data</div>
          <div>${String(err.message || err)}</div>
          <div style="margin-top: 8px;">
            From the workspace folder, run:
            <code>python scripts/build_dashboard_data.py</code>
            then refresh this page.
          </div>
        </div>`;
    }

    // ---------- Bootstrap ----------

    function loadData() {
      if (typeof window.dashboardData === "undefined") {
        throw new Error(
          "data.js not found or did not load. " +
          "Run `python scripts/build_dashboard_data.py` from the workspace folder."
        );
      }
      const d = window.dashboardData;
      const portfolio = d.portfolio;
      const positions = d.positions_open || [];
      const alerts = d.alerts || [];

      renderHeader(portfolio, positions);
      renderAlerts(alerts);
      renderPositions(positions, portfolio, alerts);
      renderRiskTab(portfolio, positions, alerts);
      renderFooter(portfolio, d.built_at);
    }

    try {
      loadData();
    } catch (err) {
      showError(err);
    }
  </script>
</body>
</html>
